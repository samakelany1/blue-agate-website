<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تسجيل حضور مشتركات نادي العقيق الأزرق">
  <title>Blue Agate | تسجيل الحضور</title><link rel="stylesheet" href="reception.css">
</head>
<body>
<header class="top"><div><strong>BLUE AGATE</strong><span>تسجيل حضور المشتركات</span></div><button id="logout" hidden>تسجيل الخروج</button></header>
<main>
  <section id="login-card" class="card">
    <h1>دخول موظفة الاستقبال</h1><p>استخدمي حساب الإدارة المصرح له بمسح بطاقات العضوية.</p>
    <div id="login-message" class="message" hidden></div>
    <form id="login-form"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required autocomplete="username"><label for="password">كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">دخول</button></form>
  </section>
  <section id="scanner-card" class="card" hidden>
    <h1>مسح بطاقة العضوية</h1><p>وجّهي كاميرا الجهاز إلى رمز QR الظاهر في حساب المشتركة.</p>
    <div id="scan-message" class="message" hidden></div><div id="reader"></div>
    <div class="manual"><label for="manual-uid">إذا تعذّر المسح، أدخلي رمز الحساب يدويًا (UID)</label><input id="manual-uid" autocomplete="off" placeholder="رمز الحساب"><button id="manual-submit" type="button">التحقق وتسجيل الحضور</button></div>
    <div id="last-result" class="result" hidden></div>
    <p class="notice">لا تسجلي الحضور إلا بعد التأكد من أن صاحبة الحساب موجودة في النادي. الرمز وحده لا يثبت هوية حاملة الجوال.</p>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="reception.js"></script>
</body></html>
