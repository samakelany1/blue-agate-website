<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blue Agate Fitness for Women - بوابة المشتركات">
  <title>Blue Agate | بوابة المشتركات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">BA</div>
      <div>
        <div class="brand-name">BLUE AGATE</div>
        <div class="brand-sub">FITNESS FOR WOMEN</div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">BLUE AGATE • MEMBERS PORTAL</p>
      <h1>أهلاً بكِ في<br><span>Blue Agate</span></h1>
      <p class="hero-text">كل ما تحتاجينه لناديكِ في مكان واحد.</p>
      <div class="hero-line"></div>
    </section>

    <section class="welcome-card">
      <div>
        <p class="small-label">بوابة المشتركات</p>
        <h2>اختاري ما تحتاجينه اليوم</h2>
        <p>الجداول، نظام النادي، دليل الأجهزة والمواعيد — كلها هنا.</p>
      </div>
    </section>

    <section class="menu-grid" aria-label="أقسام الموقع">
      <button class="menu-card featured" data-page="schedule">
        <span class="icon">📅</span>
        <span class="card-title">جدول الكلاسات</span>
        <span class="card-desc">اختاري اليوم وشوفي جدولك</span>
        <span class="arrow">←</span>
      </button>

      <button class="menu-card" data-page="equipment">
        <span class="icon">🏋🏻‍♀️</span>
        <span class="card-title">دليل الأجهزة</span>
        <span class="card-desc">طريقة استخدام الأجهزة والتمارين</span>
        <span class="arrow">←</span>
      </button>

      <button class="menu-card" data-page="rules">
        <span class="icon">📋</span>
        <span class="card-title">نظام النادي</span>
        <span class="card-desc">التعليمات والقواعد المهمة</span>
        <span class="arrow">←</span>
      </button>

      <button class="menu-card" data-page="hours">
        <span class="icon">⏰</span>
        <span class="card-title">مواعيد النادي</span>
        <span class="card-desc">أوقات العمل والكلاسات</span>
        <span class="arrow">←</span>
      </button>

      <button class="menu-card" data-page="news">
        <span class="icon">📢</span>
        <span class="card-title">الإعلانات</span>
        <span class="card-desc">آخر التنبيهات والتحديثات</span>
        <span class="arrow">←</span>
      </button>

      <button class="menu-card" data-page="contact">
        <span class="icon">📞</span>
        <span class="card-title">تواصل معنا</span>
        <span class="card-desc">طرق التواصل مع النادي</span>
        <span class="arrow">←</span>
      </button>
    </section>

    <section id="content" class="content-section" hidden></section>

    <footer>
      <p>التزامك اليوم .. هو قوتك غداً</p>
      <span>BLUE AGATE • FITNESS FOR WOMEN</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
